name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest is 26.04, which has no Python 3.9 build.
          # 3.9 is what stock macOS ships, so that check stays on macOS.
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
